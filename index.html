<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RSSB Open Sewa Registration</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#EEF3FA;
      --surface:#FFFFFF;
      --text:#111827;
      --muted:#6B7280;
      --border:#DDE5F0;
      --primary:#163B8F;
      --primary-600:#2563EB;
      --success:#0F766E;
      --danger:#B91C1C;
      --soft-blue:#EFF6FF;
      --registered-bg:#ECFDF5;
      --registered-border:#A7F3D0;
      --shadow: 0 14px 34px rgba(17, 24, 39, .10);
      --radius: 22px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Roboto, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.12), transparent 28%),
        linear-gradient(180deg, #F8FAFC 0%, var(--bg) 100%);
      color: var(--text);
    }

    header{
      position: sticky;
      top:0;
      z-index:10;
      background: linear-gradient(135deg, var(--primary), #111827);
      color:#fff;
      padding: 20px 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
    }

    header h1{
      margin:0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    header p{
      margin:6px 0 0;
      font-size: 13px;
      opacity:.9;
    }

    main{
      max-width: 920px;
      margin: 0 auto;
      padding: 22px 16px;
    }

    .card{
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(8px);
    }

    .cardBody{ padding: 20px; }

    .formGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:16px;
      margin-bottom: 18px;
    }

    .fieldGroup{
      margin-bottom: 0;
      padding: 14px;
      border: 1px solid #E8EEF7;
      border-radius: 18px;
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
    }

    label{
      display:block;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 10px;
      letter-spacing: .2px;
    }

    select{
      width:100%;
      min-height: 58px;
      padding: 0 16px;
      border-radius: 16px;
      border:1px solid var(--border);
      background:#fff;
      font-size: 17px;
      font-weight: 500;
      line-height: 1.3;
      outline:none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }
    select:focus{
      border-color: rgba(37,99,235,.55);
      box-shadow: 0 0 0 4px rgba(37,99,235,.12);
    }

    .list{
      margin-top: 4px;
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    .listHeader{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content: space-between;
      padding: 14px 16px;
      background: linear-gradient(90deg, #F8FAFC, #EFF6FF);
      border-bottom: 1px solid var(--border);
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 9px 13px;
      border-radius: 999px;
      background: #EEF2FF;
      color: #1E3A8A;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    .btnRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    button{
      border:0;
      border-radius: 999px;
      padding: 11px 16px;
      font-weight: 600;
      font-size: 14px;
      cursor:pointer;
      transition: transform .04s ease, opacity .2s ease;
      min-height: 40px;
    }
    button:active{ transform: scale(.99); }
    button:disabled{ opacity:.5; cursor:not-allowed; }

    .btnGhost{
      background:#fff;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btnPrimary{ background: var(--primary-600); color:#fff; box-shadow: 0 8px 18px rgba(37,99,235,.22); }
    .btnSuccess{ background: var(--success); color: #fff; }
    .btnCancel{ background:#F3F4F6; color:#374151; border:1px solid var(--border); }
    .btnGhost:hover, .btnCancel:hover{ background:#F9FAFB; }
    .btnPrimary:hover{ filter: brightness(.98); }

    .listBody{
      max-height: 55vh;
      overflow:auto;
    }

    .item{
      display:flex;
      align-items:center;
      gap:12px;
      padding: 14px 16px;
      border-bottom: 1px solid #F3F4F6;
    }
    .item:last-child{ border-bottom:0; }

    .item.registered{
      background: var(--registered-bg);
      border-bottom-color: var(--registered-border);
    }

    .check{
      width: 22px;
      height: 22px;
      accent-color: var(--primary-600);
      cursor:pointer;
      flex: 0 0 auto;
    }

    .registeredMark{
      width: 24px;
      height: 24px;
      border-radius: 999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      color: var(--success);
      background:#D1FAE5;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .nameWrap{
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width:0;
    }

    .name{
      font-size: 15px;
      font-weight: 500;
      line-height: 1.2;
    }

    .miniStatus{
      font-size: 12px;
      color: var(--success);
      font-weight: 500;
    }

    .footer{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap:12px;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: #fff;
    }

    .status{
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }
    .ok{ color: var(--success); font-weight: 600; }
    .err{ color: var(--danger); font-weight: 600; }

    iframe{ display:none; }

    @media (max-width: 720px){
      .formGrid{ grid-template-columns: 1fr; }
    }

    @media (max-width: 520px){
      main{ padding: 14px 10px; }
      .cardBody{ padding: 14px; }
      .fieldGroup{ padding: 12px; }
      select{ min-height: 56px; font-size: 16px; }
      .listHeader{ flex-direction: column; align-items: stretch; }
      .btnRow{ justify-content: stretch; }
      .btnRow button{ width: 100%; }
      .footer{ flex-direction: column; align-items: stretch; }
      .footer button{ width: 100%; }
    }
  </style>
</head>

<body>
  <header>
    <h1>RSSB Open Sewa Registration</h1>
    <p id="headerSubline">Today: loading…</p>
  </header>

  <main>
    <div class="card">
      <div class="cardBody">
        <div class="formGrid">
          <div class="fieldGroup">
            <label>Date / Day</label>
            <select id="dateSelect" disabled>
              <option value="">Loading…</option>
            </select>
          </div>

          <div class="fieldGroup">
            <label>Department</label>
            <select id="deptSelect" disabled>
              <option value="">Select a date first…</option>
            </select>
          </div>
        </div>

        <div class="list">
          <div class="listHeader">
            <span class="pill" id="countPill">0 selected</span>

            <div class="btnRow">
              <button class="btnGhost" id="selectAllBtn" disabled>Select all</button>
              <button class="btnGhost" id="clearBtn" disabled>Clear</button>
            </div>
          </div>

          <div class="listBody" id="nameList"></div>
        </div>
      </div>

      <div class="footer">
        <div class="btnRow">
          <button class="btnCancel" id="cancelBtn" disabled>Cancel</button>
          <button class="btnPrimary" id="registerBtn" disabled>Register selected</button>
          <button class="btnSuccess" id="doneBtn" style="display:none;">Done</button>
        </div>
        <div class="status" id="status"></div>
      </div>

      <iframe name="hiddenFrame"></iframe>

      <form id="postForm" target="hiddenFrame" method="POST" style="display:none;">
        <input type="hidden" name="action" value="register" />
        <input type="hidden" name="records" id="recordsField" value="[]" />
      </form>
    </div>
  </main>

  <script>
    /***********************
     * Paste your Apps Script Web App URL here:
     ***********************/
    const API_BASE = "https://script.google.com/macros/s/AKfycbxh0C63rp_Ep_8ltS0p3ummdgxlnTorMVX89VeDWhAaABVH_cx4exDgjANugCdvGtxk/exec";

    let peopleByDept = {};
    let registeredByDateDept = {};
    let currentDept = "";
    let currentDateKey = "";
    let currentDateDisplay = "";
    let selected = new Set();

    const dateSelect   = document.getElementById("dateSelect");
    const deptSelect   = document.getElementById("deptSelect");
    const nameList     = document.getElementById("nameList");
    const registerBtn  = document.getElementById("registerBtn");
    const selectAllBtn = document.getElementById("selectAllBtn");
    const clearBtn     = document.getElementById("clearBtn");
    const cancelBtn    = document.getElementById("cancelBtn");
    const statusEl     = document.getElementById("status");
    const countPill    = document.getElementById("countPill");
    const postForm     = document.getElementById("postForm");
    const recordsField = document.getElementById("recordsField");
    const doneBtn      = document.getElementById("doneBtn");
    const headerSubline = document.getElementById("headerSubline");

    function loadJSONP(url) {
      return new Promise((resolve, reject) => {
        const cbName = "cb_" + Math.random().toString(36).slice(2);
        window[cbName] = (data) => { cleanup(); resolve(data); };
        const script = document.createElement("script");
        script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cbName;
        script.onerror = () => { cleanup(); reject(new Error("JSONP load failed")); };
        document.head.appendChild(script);
        function cleanup(){ delete window[cbName]; script.remove(); }
      });
    }

    function setHeaderDate(dateText) {
      const fallbackDate = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Bangkok",
        day: "2-digit",
        month: "2-digit",
        year: "2-digit"
      }).format(new Date());
      const fallbackDay = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Bangkok",
        weekday: "long"
      }).format(new Date());

      headerSubline.textContent = `Today: ${dateText || `${fallbackDate} - ${fallbackDay}`} • Select date, select department, tick names, then register.`;
    }

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = "status " + (type === "ok" ? "ok" : type === "err" ? "err" : "");
    }

    function setLoadedEnabled(enabled) {
      dateSelect.disabled = !enabled;
      deptSelect.disabled = !enabled || !currentDateKey;
      updateActionButtons();
    }

    function updateActionButtons() {
      const canUseList = !!currentDateKey && !!currentDept;
      selectAllBtn.disabled = !canUseList;
      clearBtn.disabled = !canUseList;
      registerBtn.disabled = selected.size === 0 || !canUseList;
      cancelBtn.disabled = !currentDateKey && !currentDept && selected.size === 0;
      countPill.textContent = `${selected.size} selected`;
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function isRegistered(name) {
      return !!(
        registeredByDateDept[currentDateKey] &&
        registeredByDateDept[currentDateKey][currentDept] &&
        registeredByDateDept[currentDateKey][currentDept][name]
      );
    }

    function renderNames() {
      nameList.innerHTML = "";
      selected.clear();
      updateActionButtons();

      if (!currentDateKey) {
        nameList.innerHTML = `<div class="item"><div class="name" style="font-weight:400;color:#6B7280;">Select a date/day first.</div></div>`;
        return;
      }

      if (!currentDept) {
        nameList.innerHTML = `<div class="item"><div class="name" style="font-weight:400;color:#6B7280;">Select a department to show names.</div></div>`;
        return;
      }

      const list = (peopleByDept[currentDept] || []);
      if (list.length === 0) {
        nameList.innerHTML = `<div class="item"><div class="name" style="font-weight:400;color:#6B7280;">No names found for this department.</div></div>`;
        return;
      }

      list.forEach(p => {
        const id = p.name;
        const alreadyRegistered = isRegistered(id);

        const row = document.createElement("div");
        row.className = "item" + (alreadyRegistered ? " registered" : "");

        if (alreadyRegistered) {
          const mark = document.createElement("span");
          mark.className = "registeredMark";
          mark.textContent = "✓";
          row.appendChild(mark);
        } else {
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.className = "check";
          cb.addEventListener("change", () => {
            if (cb.checked) selected.add(id);
            else selected.delete(id);
            updateActionButtons();
          });

          row.addEventListener("click", (ev) => {
            if (ev.target.tagName.toLowerCase() === "input") return;
            cb.checked = !cb.checked;
            cb.dispatchEvent(new Event("change"));
          });

          row.appendChild(cb);
        }

        const label = document.createElement("div");
        label.className = "nameWrap";
        label.innerHTML = `
          <div class="name">${escapeHtml(p.name)}</div>
          ${alreadyRegistered ? `<div class="miniStatus">Already registered for ${escapeHtml(currentDateDisplay)}</div>` : ``}
        `;

        row.appendChild(label);
        nameList.appendChild(row);
      });
    }


    function resetRegistrationFlow() {
      selected.clear();
      currentDateKey = "";
      currentDateDisplay = "";
      currentDept = "";
      dateSelect.value = "";
      deptSelect.value = "";
      deptSelect.disabled = true;
      doneBtn.style.display = "none";
      setStatus("Selection cancelled. Choose a date to begin again.", "");
      renderNames();
    }

    dateSelect.addEventListener("change", () => {
      currentDateKey = dateSelect.value;
      currentDateDisplay = dateSelect.options[dateSelect.selectedIndex]?.text || "";
      currentDept = "";
      deptSelect.value = "";
      doneBtn.style.display = "none";
      deptSelect.disabled = !currentDateKey;
      setStatus("", "");
      renderNames();
    });

    deptSelect.addEventListener("change", () => {
      currentDept = deptSelect.value;
      doneBtn.style.display = "none";
      setStatus("", "");
      renderNames();
    });

    selectAllBtn.addEventListener("click", () => {
      const checkboxes = nameList.querySelectorAll('input[type="checkbox"]');
      checkboxes.forEach(cb => {
        if (!cb.checked) {
          cb.checked = true;
          cb.dispatchEvent(new Event("change"));
        }
      });
    });

    clearBtn.addEventListener("click", () => {
      const checkboxes = nameList.querySelectorAll('input[type="checkbox"]');
      checkboxes.forEach(cb => {
        if (cb.checked) {
          cb.checked = false;
          cb.dispatchEvent(new Event("change"));
        }
      });
    });

    cancelBtn.addEventListener("click", resetRegistrationFlow);

    registerBtn.addEventListener("click", () => {
      if (!currentDateKey || !currentDept || selected.size === 0) return;

      const records = Array.from(selected).map(name => ({
        sewaDate: currentDateKey,
        department: currentDept,
        name
      }));

      postForm.action = API_BASE;
      recordsField.value = JSON.stringify(records);

      setStatus("Registering…", "");
      registerBtn.disabled = true;
      doneBtn.style.display = "none";

      postForm.submit();

      setTimeout(() => {
        if (!registeredByDateDept[currentDateKey]) registeredByDateDept[currentDateKey] = {};
        if (!registeredByDateDept[currentDateKey][currentDept]) registeredByDateDept[currentDateKey][currentDept] = {};
        records.forEach(r => registeredByDateDept[currentDateKey][currentDept][r.name] = true);

        setStatus(`Registered ${records.length} people successfully for ${currentDateDisplay}.`, "ok");
        doneBtn.style.display = "inline-flex";
        renderNames();
      }, 700);
    });

    doneBtn.addEventListener("click", () => {
      location.reload();
    });

    (async function init() {
      try {
        setHeaderDate();
        setStatus("Loading dates and departments…", "");

        const data = await loadJSONP(API_BASE + "?action=list");
        if (!data || !data.ok) throw new Error((data && data.error) ? data.error : "Unknown error");

        setHeaderDate(data.todayDisplay);
        peopleByDept = data.peopleByDept || {};
        registeredByDateDept = data.registeredByDateDept || {};

        const days = data.days || [];
        if (days.length === 0) {
          dateSelect.innerHTML = `<option value="">No open sewa dates found</option>`;
          deptSelect.innerHTML = `<option value="">No date available</option>`;
          setLoadedEnabled(false);
          setStatus("No today/future dates found in OpenSewa_days.", "err");
          renderNames();
          return;
        }

        dateSelect.innerHTML =
          `<option value="">Select date/day…</option>` +
          days.map(d => `<option value="${escapeHtml(d.dateKey)}">${escapeHtml(d.display)}</option>`).join("");

        const depts = data.departments || [];
        deptSelect.innerHTML =
          `<option value="">Select a department…</option>` +
          depts.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join("");

        setLoadedEnabled(true);
        setStatus("Ready.", "ok");
        renderNames();
      } catch (err) {
        setLoadedEnabled(false);
        setStatus("Failed to load data: " + (err.message || err), "err");
        dateSelect.innerHTML = `<option value="">Error</option>`;
        deptSelect.innerHTML = `<option value="">Error</option>`;
        nameList.innerHTML = `<div class="item"><div class="name" style="font-weight:400;color:#6B7280;">Check your Web App URL, deployment access, and sheet tab names.</div></div>`;
      }
    })();
  </script>
</body>
</html>
