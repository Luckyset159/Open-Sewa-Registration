<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RSSB Open Sewa Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#F5F7FB; --surface:#FFFFFF; --text:#111827; --muted:#6B7280; --border:#E5E7EB;
      --primary:#1E40AF; --primary-600:#2563EB; --success:#0F766E; --danger:#B91C1C;
      --shadow: 0 6px 18px rgba(17, 24, 39, .08); --radius: 16px;
    }
    body{ margin:0; font-family: Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header{ position: sticky; top:0; z-index:10; background: linear-gradient(135deg, var(--primary), #111827); color:#fff; padding: 18px 16px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
    header h1{ margin:0; font-size: 18px; }
    header p{ margin:6px 0 0; font-size: 13px; opacity:.9; }
    main{ max-width: 980px; margin: 0 auto; padding: 16px; }
    .card{ background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow:hidden; }
    .cardBody{ padding: 16px; }
    label{ display:block; font-size: 12px; font-weight: 500; color: var(--muted); margin: 12px 0 6px; }
    select{ width:100%; padding: 12px; border-radius: 12px; border:1px solid var(--border); font-size: 15px; background: #fff; }
    .list{ margin-top: 14px; border-top: 1px solid var(--border); }
    .listHeader{ display:flex; gap:10px; align-items:center; justify-content: space-between; padding: 12px 16px; background: #F9FAFB; }
    .pill{ padding: 6px 12px; border-radius: 999px; background: #EEF2FF; color: #1E3A8A; font-size: 12px; font-weight: 600; }
    button{ border:0; border-radius: 999px; padding: 10px 16px; font-weight: 600; cursor:pointer; transition: opacity 0.2s; }
    button:disabled{ opacity: 0.5; cursor: not-allowed; }
    .btnPrimary{ background: var(--primary-600); color:#fff; }
    .btnGhost{ background:#fff; border: 1px solid var(--border); }
    .item{ display:flex; align-items:center; gap:12px; padding: 12px 16px; border-bottom: 1px solid #F3F4F6; cursor:pointer; }
    .check{ width: 20px; height: 20px; accent-color: var(--primary-600); }
    .registered-icon { color: var(--success); font-weight: bold; margin-left: auto; font-size: 14px; }
    .status{ padding: 16px; font-size: 13px; text-align: center; min-height: 50px; }
    .ok{ color: var(--success); font-weight: bold; }
    .err{ color: var(--danger); font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>RSSB Open Sewa Registration</h1>
    <p id="headerDate"></p>
    <p>Select date and department, tick names, then register.</p>
  </header>

  <main>
    <div class="card">
      <div class="cardBody">
        <label>Sewa Date</label>
        <select id="dateSelect" disabled><option value="">Loading dates...</option></select>

        <label>Department</label>
        <select id="deptSelect" disabled><option value="">Select date first...</option></select>

        <div class="list">
          <div class="listHeader">
            <span class="pill" id="countPill">0 selected</span>
            <div>
              <button class="btnGhost" id="selectAllBtn" disabled>Select All</button>
              <button class="btnGhost" id="clearBtn" disabled>Clear</button>
            </div>
          </div>
          <div id="nameList" style="max-height: 400px; overflow: auto; min-height: 100px;"></div>
        </div>
      </div>
      <div class="status" id="status"></div>
      <div style="padding: 16px; display: flex; gap: 10px;">
        <button class="btnPrimary" id="registerBtn" style="flex:1" disabled>Register Selected</button>
        <button class="btnGhost" id="doneBtn" style="display:none" onclick="location.reload()">Done</button>
      </div>
    </div>
  </main>

  <form id="postForm" method="POST" target="hiddenFrame" style="display:none">
    <input type="hidden" name="action" value="register">
    <input type="hidden" name="sewaDate" id="sewaDateField">
    <input type="hidden" name="records" id="recordsField">
  </form>
  <iframe name="hiddenFrame" style="display:none"></iframe>

  <script>
    const API_BASE = "https://script.google.com/macros/s/AKfycbxh0C63rp_Ep_8ltS0p3ummdgxlnTorMVX89VeDWhAaABVH_cx4exDgjANugCdvGtxk/exec"; 
    
    let appData = { peopleByDept: {}, dates: [], existingRegs: [] };
    let selectedNames = new Set();

    // Set Header Date
    const now = new Date();
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const formattedToday = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getFullYear()).slice(-2)} - ${days[now.getDay()]}`;
    document.getElementById('headerDate').textContent = formattedToday;

    const dateSelect = document.getElementById('dateSelect');
    const deptSelect = document.getElementById('deptSelect');
    const nameList = document.getElementById('nameList');
    const registerBtn = document.getElementById('registerBtn');
    const statusEl = document.getElementById('status');

    // JSONP Helper for reliable communication
    function loadJSONP(url) {
      return new Promise((resolve, reject) => {
        const cbName = "cb_" + Math.random().toString(36).slice(2);
        window[cbName] = (data) => { cleanup(); resolve(data); };
        const script = document.createElement("script");
        script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cbName;
        script.onerror = () => { cleanup(); reject(new Error("Network Error (Check URL)")); };
        document.head.appendChild(script);
        function cleanup(){ delete window[cbName]; script.remove(); }
      });
    }

    async function init() {
      try {
        statusEl.innerHTML = "Fetching dates and names...";
        const res = await loadJSONP(`${API_BASE}?action=list`);
        if (!res.ok) throw new Error(res.error || "Failed to load data");
        
        appData = res;

        if (res.dates && res.dates.length > 0) {
          dateSelect.innerHTML = '<option value="">Select Date...</option>' + 
            res.dates.map(d => `<option value="${d.value}">${d.display}</option>`).join('');
          dateSelect.disabled = false;
          statusEl.innerHTML = "Ready.";
        } else {
          dateSelect.innerHTML = '<option value="">No future dates found</option>';
          statusEl.innerHTML = '<span class="err">No dates found in OpenSewa_days tab.</span>';
        }
      } catch (e) {
        statusEl.innerHTML = `<span class="err">Error: ${e.message}</span>`;
      }
    }

    dateSelect.onchange = () => {
      deptSelect.innerHTML = '<option value="">Select Department...</option>' + 
        appData.departments.map(d => `<option value="${d}">${d}</option>`).join('');
      deptSelect.disabled = false;
      renderNames();
    };

    deptSelect.onchange = renderNames;

    function renderNames() {
      const dept = deptSelect.value;
      const date = dateSelect.value;
      nameList.innerHTML = '';
      selectedNames.clear();
      updateUI();

      if (!dept || !date) return;

      const people = appData.peopleByDept[dept] || [];
      if (people.length === 0) {
        nameList.innerHTML = '<div style="padding:20px; color:#6B7280;">No names in this department.</div>';
        return;
      }

      people.forEach(p => {
        const isReg = appData.existingRegs.includes(`${date}__${dept}__${p.name}`);
        
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <input type="checkbox" class="check" ${isReg ? 'disabled' : ''}>
          <span style="${isReg ? 'color:#9CA3AF' : ''}">${p.name}</span>
          ${isReg ? '<span class="registered-icon">✓ Registered</span>' : ''}
        `;
        
        if (!isReg) {
          div.onclick = () => {
            const cb = div.querySelector('input');
            cb.checked = !cb.checked;
            cb.checked ? selectedNames.add(p.name) : selectedNames.delete(p.name);
            updateUI();
          };
        }
        nameList.appendChild(div);
      });
    }

    function updateUI() {
      document.getElementById('countPill').textContent = `${selectedNames.size} selected`;
      registerBtn.disabled = (selectedNames.size === 0);
      document.getElementById('selectAllBtn').disabled = !deptSelect.value;
      document.getElementById('clearBtn').disabled = !deptSelect.value;
    }

    registerBtn.onclick = () => {
      const records = Array.from(selectedNames).map(n => ({ department: deptSelect.value, name: n }));
      document.getElementById('sewaDateField').value = dateSelect.value;
      document.getElementById('recordsField').value = JSON.stringify(records);
      document.getElementById('postForm').action = API_BASE;
      document.getElementById('postForm').submit();
      
      statusEl.innerHTML = `<span class="ok">Registering ${records.length} people...</span>`;
      registerBtn.style.display = 'none';
      setTimeout(() => {
        statusEl.innerHTML = `<span class="ok">Successfully registered!</span>`;
        document.getElementById('doneBtn').style.display = 'inline-block';
      }, 1500);
    };

    document.getElementById('selectAllBtn').onclick = () => {
      nameList.querySelectorAll('input:not(:disabled)').forEach(cb => {
        if(!cb.checked) cb.parentElement.click();
      });
    };

    document.getElementById('clearBtn').onclick = () => {
      nameList.querySelectorAll('input:not(:disabled)').forEach(cb => {
        if(cb.checked) cb.parentElement.click();
      });
    };

    init();
  </script>
</body>
</html>
